plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.agungksidik.football'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.agungksidik.football'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB like the launcher: signed with the debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Android's org.json is a stub in local unit tests; this is the real one, for tests only.
    testImplementation 'org.json:json:20240303'
}
